[package]
name = "platform-chirp-auth"
# Explicit version (not inherited) so this crate can advance independently of
# platform-lambda / platform-http-error (which stay at the workspace's 0.1.0).
# 0.2.1 reverts the 0.2.0 compile-gating of decode_trusted_headers: that gate
# was a mis-design — the function is a neutral header-PARSING primitive used by
# authenticated impersonation in production (e.g. drive's internal-service
# token path), not a pure dev bypass. The unauthenticated-trust decision is
# gated at each backend instead.
# 0.2.3 bumps the workspace chirp-auth-client dep v0.7.0 -> v0.9.0 (pairwise
# subjects, no email in the verified identity). API-compatible here: this crate
# only re-exports `bearer_token`, which is unchanged.
version = "0.2.3"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared chirp-auth glue: bearer extraction, dev trusted-header decoder, header constants, generic on-behalf-of grant resolution."

[features]
# Marker feature each backend forwards to gate ITS unauthenticated trusted-header
# bypass path (the `*_TRUSTED_HEADER_AUTH=true` dev/integration affordance).
# `decode_trusted_headers` itself is unconditional — it only parses headers and
# is also used by authenticated impersonation in production.
dev-trusted-headers = []

[dependencies]
http = { workspace = true }
chirp-auth-client = { workspace = true }
uuid = { workspace = true }
async-trait = { workspace = true }
platform-http-error = { path = "../platform-http-error" }

[dev-dependencies]
tokio = { workspace = true }
